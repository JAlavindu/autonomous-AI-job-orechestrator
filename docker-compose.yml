x-common-env: &common-env
  REDIS_HOST: redis
  DATABASE_URL: postgresql+psycopg2://orchestrator:orchestrator@postgres:5432/orchestrator
  DEFAULT_TENANT_ID: 00000000-0000-0000-0000-000000000001
  DEFAULT_TENANT_NAME: default
  SCHEDULER_MODE: heuristic
  EXECUTOR_ALLOWLIST: sleep
  RUNNER: subprocess
  DEFAULT_JOB_TIMEOUT_SECONDS: 300
  JOB_TIMEOUT_GRACE_SECONDS: 5
  DEFAULT_JOB_MEMORY_MB: 0
  DEFAULT_JOB_CPU_SECONDS: 0
  LOG_LEVEL: INFO
  RL_MODEL_PATH: ai_brain.pth
  JOB_STREAM_KEY: stream:jobs
  JOB_STREAM_GROUP: workers
  JOB_STREAM_BLOCK_MS: 5000
  JOB_STREAM_MAXLEN: 10000
  JOB_STREAM_CLAIM_MIN_IDLE_MS: 60000
  RECLAIM_EVERY_N_LOOPS: 5
  JOB_DLQ_STREAM_KEY: stream:jobs:dlq
  JOB_DLQ_MAXLEN: 10000
  LEASE_KEY_PREFIX: "lease:job:"
  LEASE_TTL_SECONDS: 30
  LEASE_HEARTBEAT_SECONDS: 10
  MAX_JOB_RETRIES: 3
  RETRY_BACKOFF_BASE_SECONDS: 2.0
  RETRY_BACKOFF_MAX_SECONDS: 300.0
  MAX_RUN_OUTPUT_CHARS: 65536
  LOG_STORAGE_ROOT: /app/data/logs
  LOG_SPILL_THRESHOLD_CHARS: 4096
  LOG_INLINE_PREVIEW_CHARS: 2048
  API_URL: http://api:8000
  AUTH_ENABLED: true
  API_KEY_PEPPER: change-me-in-production
  AUTH_BOOTSTRAP_OPERATOR_KEY: ork_dev_operator_replace_me
  MAX_REQUEST_BODY_BYTES: 1048576
  DEFAULT_TENANT_MAX_JOBS: 1000
  DEFAULT_TENANT_RATE_LIMIT: 120
  RATE_LIMIT_ENABLED: "true"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Dev (default): bind-mount source for hot reload ---
  api:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/app
      - log_data:/app/data/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: .
    command: python src/orchestrator/worker.py
    environment:
      <<: *common-env
    depends_on:
      - redis
      - postgres
      - api
    volumes:
      - .:/app
      - log_data:/app/data/logs

  dashboard:
    build: .
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      <<: *common-env
      ORCHESTRATOR_API_KEY: ork_dev_operator_replace_me
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/app
      - log_data:/app/data/logs

  # --- Prod profile: immutable image, no bind mounts ---
  api-prod:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    depends_on:
      - redis
      - postgres
    profiles:
      - prod

  worker-prod:
    build: .
    command: python src/orchestrator/worker.py
    environment:
      <<: *common-env
    depends_on:
      - redis
      - postgres
      - api-prod
    profiles:
      - prod

  dashboard-prod:
    build: .
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      <<: *common-env
    depends_on:
      - redis
      - postgres
    profiles:
      - prod

volumes:
  redis_data:
  postgres_data:
  log_data: