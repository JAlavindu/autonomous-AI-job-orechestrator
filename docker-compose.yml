x-common-env: &common-env
  REDIS_HOST: redis
  SCHEDULER_MODE: heuristic
  EXECUTOR_ALLOWLIST: sleep
  LOG_LEVEL: INFO
  RL_MODEL_PATH: ai_brain.pth

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # --- Dev (default): bind-mount source for hot reload ---
  api:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    depends_on:
      - redis

  worker:
    build: .
    command: python src/orchestrator/worker.py
    volumes:
      - .:/app
    environment:
      <<: *common-env
    depends_on:
      - redis
      - api

  dashboard:
    build: .
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    environment:
      <<: *common-env
    depends_on:
      - redis

  # --- Prod profile: immutable image, no bind mounts ---
  api-prod:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    depends_on:
      - redis
    profiles:
      - prod

  worker-prod:
    build: .
    command: python src/orchestrator/worker.py
    environment:
      <<: *common-env
    depends_on:
      - redis
      - api-prod
    profiles:
      - prod

  dashboard-prod:
    build: .
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      <<: *common-env
    depends_on:
      - redis
    profiles:
      - prod

volumes:
  redis_data:
